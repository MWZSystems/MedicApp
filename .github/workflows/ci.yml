name: MedicApp CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore MedicApp.slnx --configfile NuGet.Config
      - run: dotnet format MedicApp.slnx --verify-no-changes --no-restore
      - run: dotnet build MedicApp.slnx -c Release --no-restore --warnaserror
      - run: dotnet test MedicApp.slnx -c Release --no-build --no-restore --logger trx
      - run: dotnet list MedicApp.slnx package --vulnerable --include-transitive --format json > dependency-audit.json
      - shell: pwsh
        run: |
          $audit = Get-Content dependency-audit.json -Raw | ConvertFrom-Json
          $risks = @($audit.projects.frameworks | ForEach-Object { @($_.topLevelPackages) + @($_.transitivePackages) } | ForEach-Object { $_.vulnerabilities } | Where-Object { $_.severity -in @('High', 'Critical') })
          if ($risks.Count -gt 0) { throw 'High or critical dependency vulnerabilities found.' }
